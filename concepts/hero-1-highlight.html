<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero 1 — Highlight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#0a0a0a;--mute:#777;--line:#e8e8e8;--y:#ffe14d}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:400 17px/1.55 "Inter Tight",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.wrap{max-width:1240px;margin:0 auto;padding:0 40px}
nav{display:flex;justify-content:space-between;align-items:center;padding:28px 0;font-size:15px;opacity:0;animation:fade .8s .1s forwards}
nav .links{display:flex;gap:32px;color:var(--mute)}
nav .links a{position:relative}
nav .links a::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:2px;background:var(--y);transform:scaleX(0);transform-origin:left;transition:transform .3s}
nav .links a:hover{color:var(--ink)}
nav .links a:hover::after{transform:scaleX(1)}
.hero{min-height:calc(100vh - 84px);display:grid;grid-template-columns:1fr 340px;gap:72px;align-items:center;padding:40px 0 80px}
.kicker{font:400 13px/1 "JetBrains Mono",monospace;color:var(--mute);display:flex;align-items:center;gap:10px;opacity:0;animation:fade .8s .2s forwards}
.kicker i{width:8px;height:8px;border-radius:50%;background:var(--y);box-shadow:0 0 0 0 rgba(255,225,77,.8);animation:ping 2s infinite}
h1{font-weight:500;font-size:clamp(52px,7.6vw,112px);line-height:.98;letter-spacing:-.05em;margin-top:28px}
.line{display:block;overflow:hidden;padding-bottom:.06em}
.line>span{display:inline-block;transform:translateY(105%);animation:up .9s cubic-bezier(.2,.8,.2,1) forwards}
.line:nth-child(2)>span{animation-delay:.12s}.line:nth-child(3)>span{animation-delay:.24s}
.hl{position:relative;white-space:nowrap}
.hl::before{content:"";position:absolute;left:-.06em;right:-.06em;top:.18em;bottom:.04em;background:var(--y);z-index:-1;transform:scaleX(0);transform-origin:left;animation:swipe .7s 1s cubic-bezier(.7,0,.2,1) forwards}
.rot{display:inline-grid;vertical-align:bottom}
.rot b{grid-area:1/1;font-weight:500;opacity:0;transform:translateY(40%);transition:opacity .45s,transform .45s}
.rot b.on{opacity:1;transform:none}
.rot b.off{opacity:0;transform:translateY(-40%)}
p.lead{margin-top:36px;max-width:540px;font-size:20px;color:#333;opacity:0;animation:fade .8s .9s forwards}
.cta{display:flex;gap:14px;margin-top:40px;opacity:0;animation:fade .8s 1.1s forwards}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 22px;border-radius:99px;font-weight:500;border:1.5px solid var(--ink);position:relative;overflow:hidden;isolation:isolate;transition:color .3s}
.btn.dark{background:var(--ink);color:#fff}
.btn::before{content:"";position:absolute;inset:0;background:var(--y);transform:translateY(101%);transition:transform .35s cubic-bezier(.7,0,.2,1);z-index:-1}
.btn:hover{color:var(--ink)}
.btn:hover::before{transform:none}
.btn .arr{transition:transform .3s}.btn:hover .arr{transform:translateX(4px)}
.photo{position:relative;opacity:0;animation:fade 1s .5s forwards}
.photo .frame{position:relative}
.photo .frame::before{content:"";position:absolute;inset:0;background:var(--y);transform:translate(16px,16px);transition:transform .4s}
.photo:hover .frame::before{transform:translate(24px,24px)}
.photo img{position:relative;display:block;width:100%;aspect-ratio:4/5;object-fit:cover;filter:grayscale(1) contrast(1.08);clip-path:inset(100% 0 0 0);animation:reveal 1.1s .6s cubic-bezier(.7,0,.2,1) forwards}
.photo figcaption{position:relative;margin-top:28px;font:400 12px/1.5 "JetBrains Mono",monospace;color:var(--mute);display:flex;justify-content:space-between}
@keyframes up{to{transform:none}}
@keyframes swipe{to{transform:scaleX(1)}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes reveal{to{clip-path:inset(0 0 0 0)}}
@keyframes ping{70%{box-shadow:0 0 0 10px rgba(255,225,77,0)}100%{box-shadow:0 0 0 0 rgba(255,225,77,0)}}
@media (max-width:860px){.hero{grid-template-columns:1fr;gap:48px}.photo{max-width:300px}nav .links{display:none}.wrap{padding:0 20px}}
@media (prefers-reduced-motion:reduce){*,*::before{animation-duration:.01s!important;animation-delay:0s!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <nav><b>Ece Berrak</b><div class="links"><a href="#">Work</a><a href="#">Experience</a><a href="#">Writing</a><a href="#">Contact</a></div></nav>
  <header class="hero">
    <div>
      <div class="kicker"><i></i>Available Q3 2026 — Berlin</div>
      <h1>
        <span class="line"><span>Growth marketer</span></span>
        <span class="line"><span>who <span class="hl">ships</span> what</span></span>
        <span class="line"><span>she <span class="rot" id="rot"><b class="on">markets.</b><b>automates.</b><b>writes.</b><b>builds.</b></span></span></span>
      </h1>
      <p class="lead">B2B/SaaS lifecycle and user communication — plus the breadth to build the websites, automations and AI workflows myself.</p>
      <div class="cta"><a class="btn dark" href="#">See selected work <span class="arr">→</span></a><a class="btn" href="#">Get in touch</a></div>
    </div>
    <figure class="photo"><div class="frame"><img src="../assets/ece.jpg" alt="Ece Berrak"></div><figcaption><span>Ex‑Dataiku</span><span>Co‑founder, Nautilida</span></figcaption></figure>
  </header>
</div>
<script>
const w=[...document.querySelectorAll('#rot b')];let i=0;
if(!matchMedia('(prefers-reduced-motion: reduce)').matches)setInterval(()=>{w[i].className='off';const p=w[i];setTimeout(()=>p.className='',450);i=(i+1)%w.length;w[i].className='on'},2400);
</script>
</body>
</html>
